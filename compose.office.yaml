services:
  entity-office:
    build: ./services/entity-api
    ports:
      - "127.0.0.1:${ENTITY_OFFICE_PORT:-8010}:8000"
    environment:
      ENTITY_SQLITE_PATH: /data/core.sqlite3
      ENTITY_REQUIRE_AUTH: "1"
      ENTITY_ALLOWED_ORIGINS: http://127.0.0.1:5173,http://localhost:5173,http://127.0.0.1:4175,http://localhost:4175,http://127.0.0.1:4173,http://localhost:4173,https://drbrownlabs-afk.github.io
    volumes:
      - ./.runtime/office:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')"]
      interval: 3s
      timeout: 4s
      retries: 20
