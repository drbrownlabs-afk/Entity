# ENTITY development environment. Scorpio runs from its upstream Compose configuration.
services:
  entity-api:
    build: ./services/entity-api
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      ENTITY_SQLITE_PATH: /data/entity.sqlite3
      SCORPIO_BASE_URL: http://host.docker.internal:9090
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - entity-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 2s
      timeout: 5s
      retries: 20
    restart: unless-stopped
volumes:
  entity-data:
