name: Verify original office Core and animated camera geometry
on:
  push:
    branches: [codex/phase-09-autonomous-plan]
    paths: ['scripts/phase09/demo-spatial-core.py','scripts/phase09/verify-spatial-core.mjs','.github/workflows/phase09-spatial.yml','worlds/synthetic-office/corridor-route.json']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  spatial:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r services/entity-api/requirements.lock
          npm --prefix apps/web ci
          npm --prefix apps/web run build
          cd apps/web && npx playwright install --with-deps chromium
      - name: Exercise original geometry and real Core without substituted scene
        run: .venv/bin/python scripts/phase09/demo-spatial-core.py
      - name: Preserve actual geometric integration evidence
        if: always()
        run: |
          git config user.name 'ENTITY spatial verification'
          git config user.email 'scene@users.noreply.github.com'
          git add docs/evidence/phase09/spatial-core.json
          git add docs/evidence/phase09/spatial-core*.png || true
          git diff --cached --quiet && exit 0
          git commit -m 'Record actual original SSOG Core and animated camera integration [skip ci]'
          git pull --rebase origin codex/phase-09-autonomous-plan
          git push origin HEAD:codex/phase-09-autonomous-plan
