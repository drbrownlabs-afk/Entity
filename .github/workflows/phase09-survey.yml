name: Inspect original office geometry
on:
  push:
    branches: [codex/phase-09-autonomous-plan]
    paths: ['scripts/phase09/survey-office.mjs', '.github/workflows/phase09-survey.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  survey:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm --prefix apps/web ci
      - run: npm --prefix apps/web run build
      - run: cd apps/web && npx playwright install --with-deps chromium
      - run: |
          npm --prefix apps/web run preview -- --port 4175 > /tmp/office-survey.log 2>&1 &
          node scripts/phase09/survey-office.mjs
      - name: Preserve actual scene survey
        if: always()
        run: |
          git config user.name 'ENTITY scene survey'
          git config user.email 'scene@users.noreply.github.com'
          git add docs/evidence/phase09/survey
          git diff --cached --quiet && exit 0
          git commit -m 'Record original office camera survey and measured depth points [skip ci]'
          git pull --rebase origin codex/phase-09-autonomous-plan
          git push origin HEAD:codex/phase-09-autonomous-plan
