name: Inspect authorized Synthetic Office scene
on:
  push:
    branches: [codex/phase-09-autonomous-plan]
    paths: ['scripts/phase09/discover-scene.mjs', '.github/workflows/phase09-scene.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm --prefix apps/web ci
      - run: cd apps/web && npx playwright install --with-deps chromium
      - run: node scripts/phase09/discover-scene.mjs
      - name: Preserve public scene inspection for continued integration
        run: |
          git config user.name 'ENTITY scene inspection'
          git config user.email 'scene@users.noreply.github.com'
          git add docs/evidence/phase09/scene-discovery.json docs/evidence/phase09/synthetic-office-browser.png
          git commit -m 'Record actual Synthetic Office browser requests and scene evidence [skip ci]'
          git pull --rebase origin codex/phase-09-autonomous-plan
          git push origin HEAD:codex/phase-09-autonomous-plan
