name: ENTITY API smoke tests
on:
  push:
    paths:
      - "services/entity-api/**"
      - "services/entity-edge/**"
      - "scripts/**"
      - "compose.yaml"
      - "packages/contracts/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "services/entity-api/**"
      - "services/entity-edge/**"
      - "scripts/**"
      - "compose.yaml"
      - "packages/contracts/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:
jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/entity-api/requirements.lock
      - name: Install API dependencies
        run: python -m pip install -r services/entity-api/requirements.lock
      - name: Compile Python sources
        run: python -m compileall -q services/entity-api/app services/entity-api/tests
      - name: Execute API tests
        working-directory: services/entity-api
        run: python -m unittest discover -s tests -v
      - name: Check installed dependencies
        run: python -m pip check
      - name: Start API container
        run: sh scripts/start-local.sh
      - name: Verify HTTP and persistence across container restart
        run: python scripts/smoke-docker.py
      - name: Container diagnostics
        if: failure()
        run: docker compose logs --no-color
      - name: Stop CI services
        if: always()
        run: docker compose down

  edge-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Core for local demo process
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r services/entity-api/requirements.lock
      - name: Install Edge and verify public video checksum
        run: bash scripts/setup-edge.sh
      - name: Test tracking, zones and recovery
        run: PYTHONPATH=services/entity-edge .runtime/edge-venv/bin/python -m unittest discover -s services/entity-edge/tests -v
      - name: Demonstrate real detector and REST recovery
        run: bash scripts/demo-edge.sh
      - name: Preserve numerical report only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edge-report
          path: .runtime/edge-demo/*report.json
