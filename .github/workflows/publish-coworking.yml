name: Publish P2 Coworking
on:
  push:
    branches: [codex/spatial-simulation]
    paths: ['apps/spatial-simulation/**', '.github/workflows/publish-coworking.yml']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  actions: write
concurrency:
  group: entity-pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: source
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: published
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: source/apps/spatial-simulation/package-lock.json
      - name: Build and test
        working-directory: source/apps/spatial-simulation
        run: |
          npm ci
          npm test
          npm run build -- --base=/Entity/spatial-simulation/
      - name: Disable retired publishers at repository level
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PUT repos/${{ github.repository }}/actions/workflows/pages.yml/disable
          gh api --method PUT repos/${{ github.repository }}/actions/workflows/spatial-pages.yml/disable
      - name: Publish coworking only, retiring old compiled demonstrations
        working-directory: published
        run: |
          git rm -r --ignore-unmatch .
          mkdir -p spatial-simulation
          rsync -a --delete ../source/apps/spatial-simulation/dist/ spatial-simulation/
          touch .nojekyll
          test -s spatial-simulation/index.html
          git config user.name "ENTITY Pages"
          git config user.email "deployment@users.noreply.github.com"
          cp ../source/apps/web/index.html index.html
          cp index.html 404.html
          SOURCE_SHA="${{ github.sha }}" node --input-type=module -e 'import fs from "node:fs";fs.writeFileSync("deployment.json",JSON.stringify({source_commit:process.env.SOURCE_SHA,mode:"coworking-only",active_route:"/Entity/spatial-simulation/"})+"\n")'
          cp deployment.json spatial-simulation/deployment.json
          git add --all
          if ! git diff --cached --quiet; then
            git commit -m "Publish coworking"
            git pull --rebase origin gh-pages
            git push origin HEAD:gh-pages
          fi
      - name: Request Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST repos/${{ github.repository }}/pages/builds
      - name: Verify public route
        run: |
          for i in $(seq 1 18); do
            if curl -fsSL https://drbrownlabs-afk.github.io/Entity/deployment.json -o /tmp/deployment.json && SOURCE_SHA='${{ github.sha }}' node -e 'let d=require("/tmp/deployment.json");if(d.source_commit!==process.env.SOURCE_SHA||d.mode!=="coworking-only")process.exit(1)'; then curl -fsSL https://drbrownlabs-afk.github.io/Entity/spatial-simulation/ -o /tmp/coworking.html; ! grep -Eiq 'Mall Lab|ENTITY Experience|shopping-mall' /tmp/coworking.html; exit $?; fi
            sleep 10
          done
          exit 1
