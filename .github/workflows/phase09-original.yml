name: Verify original Synthetic Office integration
on:
  push:
    branches: [codex/phase-09-autonomous-plan]
    paths: ['apps/web/src/office/**', 'apps/web/office.html', 'scripts/phase09/verify-original-office.mjs', '.github/workflows/phase09-original.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  original:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm --prefix apps/web ci
      - run: npm --prefix apps/web run build
      - run: cd apps/web && npx playwright install --with-deps chromium
      - name: Verify the original asset and native voxel collision integration
        run: |
          npm --prefix apps/web run preview -- --port 4175 > /tmp/office-preview.log 2>&1 &
          node scripts/phase09/verify-original-office.mjs
      - name: Persist observed evidence
        if: always()
        run: |
          git config user.name 'ENTITY integration verification'
          git config user.email 'scene@users.noreply.github.com'
          git add docs/evidence/phase09/original-integration.json
          git add docs/evidence/phase09/integrated-original-*.png || true
          git commit -m 'Record original SSOG scene and collision integration evidence [skip ci]'
          git pull --rebase origin codex/phase-09-autonomous-plan
          git push origin HEAD:codex/phase-09-autonomous-plan
