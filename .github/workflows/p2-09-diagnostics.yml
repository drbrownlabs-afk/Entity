name: P2-09 delivery diagnostics
on:
  push:
    branches: [codex/spatial-simulation]
    paths: ['.github/workflows/p2-09-diagnostics.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
  pages: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Read actual failed jobs and public Pages state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/p2-diagnostics
          for job in 129252462392 129252461537 129252462220; do
            gh api repos/${{ github.repository }}/actions/jobs/$job/logs > /tmp/p2-diagnostics/$job.log || true
          done
          gh api repos/${{ github.repository }}/pages > /tmp/p2-diagnostics/pages.json
          python - <<'PY'
          import json,re,subprocess
          from pathlib import Path
          folder=Path('/tmp/p2-diagnostics');report={'source_commit':'${{ github.sha }}','jobs':{}}
          for path in folder.glob('*.log'):
              lines=path.read_text(errors='replace').splitlines()
              relevant=[re.sub(r'\x1b\[[0-9;]*m','',line) for line in lines if re.search(r'error|fail|exception|traceback|assert|curl:|HTTP/|not found|timeout',line,re.I) and not re.search(r'token|secret|password|authorization',line,re.I)]
              report['jobs'][path.stem]={'error_context':relevant[-35:],'log_lines':len(lines)}
          pages=json.loads((folder/'pages.json').read_text());report['pages']={k:pages.get(k)for k in ['status','html_url','public','build_type','https_enforced','source','cname']}
          report['public_http']={}
          for key,url in [('manifest','https://drbrownlabs-afk.github.io/Entity/deployment.json'),('coworking','https://drbrownlabs-afk.github.io/Entity/spatial-simulation/')]:
              body=folder/(key+'.body');r=subprocess.run(['curl','-sSL','--max-time','25','-w','%{http_code}','-o',str(body),url],capture_output=True,text=True)
              item={'status':r.stdout,'exit_code':r.returncode,'bytes':body.stat().st_size if body.exists()else 0}
              if body.exists():
                  text=body.read_text(errors='replace')
                  try:item['manifest']=json.loads(text)
                  except ValueError:item['html_title']=re.findall(r'<title>(.*?)</title>',text,re.S)[:1]
              report['public_http'][key]=item
          out=Path('docs/spatial-simulation/evidence/p2-09/09.9/remote-diagnostics.json');out.write_text(json.dumps(report,indent=2)+'\n')
          PY
      - name: Record sanitized diagnostic evidence on working branch
        run: |
          git config user.name 'ENTITY delivery diagnostics'
          git config user.email 'deployment@users.noreply.github.com'
          git add docs/spatial-simulation/evidence/p2-09/09.9/remote-diagnostics.json
          git commit -m 'test(P2-09): record actual sanitized delivery failure diagnostics'
          git pull --rebase origin codex/spatial-simulation
          git push origin HEAD:codex/spatial-simulation
