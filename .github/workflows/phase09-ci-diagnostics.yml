name: Retrieve actual office CI failure diagnostics
on:
  push:
    branches: [codex/phase-09-autonomous-plan]
    paths: ['scripts/phase09/inspect-ci.py', '.github/workflows/phase09-ci-diagnostics.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: python scripts/phase09/inspect-ci.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Preserve failure evidence for correction
        run: |
          git config user.name 'ENTITY CI diagnostics'
          git config user.email 'ci@users.noreply.github.com'
          git add docs/evidence/phase09/ci-failure-*.txt
          git diff --cached --quiet && exit 0
          git commit -m 'Record actual Office HTTP CI failure diagnostics [skip ci]'
          git pull --rebase origin codex/phase-09-autonomous-plan
          git push origin HEAD:codex/phase-09-autonomous-plan
